<!DOCTYPE html>
<!--
================================================================================
 MARKDOWN → PDF CONVERTER & LIVE PREVIEW STUDIO
 Single-file, self-contained web application. 
 No build step, no npm, no server required — runs directly in your browser.
 
 QUICK START GUIDE:
 1. Double-click this .html file to launch it in any modern browser (Chrome, Edge, Firefox, Safari).
 2. Write or paste your Markdown in the left editor; the live preview renders on every keystroke.
 3. Open local .md files using the "Open .md" button or drag & drop files onto the editor window.
 4. Click "Export PDF" (or press Ctrl+P / Cmd+P) to generate crisp vector PDFs via the browser's
    native print engine.
    - PRINT RECOMMENDATION: In the browser print dialog, set Margins to "Default" (the stylesheet
      already enforces strict 18mm margins). Check "Background graphics" to preserve code blocks,
      table zebra-stripes, and dark mode background colors.
 5. Extra features included:
    - GitHub Flavored Markdown (GFM): tables, task lists, strikethrough, autolinks, code fences
    - KaTeX mathematical formula rendering ($inline$ and $$display$$)
    - Mermaid.js vector diagram rendering (```mermaid blocks)
    - Syntax highlighting via highlight.js with language labels and 1-click code copying
    - Dark mode toggle that styles both the live UI and the PDF print output
    - Real-time document statistics (word count, character count, reading time)
    - LocalStorage auto-save so your work survives page reloads
    - "Copy HTML" button with instant clipboard confirmation
    - Draggable splitter to resize editor and preview panes to your preference
================================================================================
-->

    /* ==========================================================================
       CSS Variables & Design System Tokens
       ========================================================================== */
    :root {
      /* Light Theme Color Palette */
      --bg-app: #f8fafc;
      --bg-header: #ffffff;
      --bg-surface: #ffffff;
      --bg-surface-secondary: #f1f5f9;
      --bg-editor: #ffffff;
      --bg-preview-canvas: #f1f5f9;
      --bg-preview-paper: #ffffff;
      --bg-code-block: #f8fafc;
      --bg-code-header: #eef2f6;
      --bg-inline-code: #f1f5f9;
      --bg-table-header: #f8fafc;
      --bg-table-alt: #fbfcfe;
      --bg-blockquote: #f8fafc;

      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --text-code: #0f172a;

      --border-color: #e2e8f0;
      --border-subtle: #f1f5f9;
      --border-focus: #3b82f6;

      --accent-primary: #2563eb;
      --accent-primary-hover: #1d4ed8;
      --accent-primary-text: #ffffff;
      --accent-badge: #dbeafe;
      --accent-badge-text: #1e40af;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
      --shadow-paper: 0 4px 20px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      /* Print variables (Light mode print defaults) */
      --print-bg: #ffffff;
      --print-text: #111827;
      --print-code-bg: #f8fafc;
      --print-code-border: #e2e8f0;
      --print-border: #e5e7eb;
    }

    [data-theme="dark"] {
      /* Dark Theme Color Palette */
      --bg-app: #0f172a;
      --bg-header: #1e293b;
      --bg-surface: #1e293b;
      --bg-surface-secondary: #0f172a;
      --bg-editor: #141e30;
      --bg-preview-canvas: #0b1120;
      --bg-preview-paper: #1e293b;
      --bg-code-block: #131c2e;
      --bg-code-header: #1b263b;
      --bg-inline-code: #24324d;
      --bg-table-header: #182235;
      --bg-table-alt: #162032;
      --bg-blockquote: #172236;

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      --text-code: #f1f5f9;

      --border-color: #334155;
      --border-subtle: #1e293b;
      --border-focus: #60a5fa;

      --accent-primary: #3b82f6;
      --accent-primary-hover: #60a5fa;
      --accent-primary-text: #ffffff;
      --accent-badge: #1e3a8a;
      --accent-badge-text: #93c5fd;

      --shadow-paper: 0 6px 24px -2px rgba(0, 0, 0, 0.4);

      /* Print variables (Dark mode print output) */
      --print-bg: #141b2d;
      --print-text: #f1f5f9;
      --print-code-bg: #0f1523;
      --print-code-border: #2d3b55;
      --print-border: #334155;
    }

    /* ==========================================================================
       Global & Reset Rules
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: var(--font-sans);
      color: var(--text-main);
      background-color: var(--bg-app);
      overflow: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ==========================================================================
       Application Shell
       ========================================================================== */
    .app-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* ==========================================================================
       Header & Navigation Toolbar
       ========================================================================== */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 16px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      z-index: 20;
      flex-shrink: 0;
      gap: 12px;
    }

    .header-left, .header-center, .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: var(--text-main);
      text-decoration: none;
      user-select: none;
    }

    .brand-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #ffffff;
      border-radius: 6px;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.25);
    }

    .filename-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--bg-surface-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }

    .doc-stats {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn:hover {
      background: var(--bg-surface-secondary);
      border-color: var(--text-light);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-icon-only {
      padding: 0;
      width: 34px;
    }

    .btn-primary {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: var(--accent-primary-text);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(37, 99, 235, 0.2);
    }

    .btn-primary:hover {
      background: var(--accent-primary-hover);
      border-color: var(--accent-primary-hover);
      color: var(--accent-primary-text);
    }

    /* ==========================================================================
       Main Workspace & Split Container
       ========================================================================== */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Left: Editor Pane */
    .pane-editor {
      display: flex;
      flex-direction: column;
      width: 50%;
      min-width: 280px;
      background: var(--bg-surface);
      position: relative;
      overflow: hidden;
      border-right: 1px solid var(--border-color);
    }

    .pane-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
      padding: 0 12px;
      background: var(--bg-surface-secondary);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .formatting-bar {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.1s ease;
    }

    .tool-btn:hover {
      background: var(--border-color);
      color: var(--text-main);
    }

    .editor-wrapper {
      position: relative;
      flex: 1;
      height: 100%;
      overflow: hidden;
      display: flex;
    }

    #markdown-editor {
      width: 100%;
      height: 100%;
      padding: 16px 20px;
      border: none;
      outline: none;
      resize: none;
      background: var(--bg-editor);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.65;
      tab-size: 2;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-y: auto;
    }

    /* Drag & Drop Visual Overlay */
    .drop-overlay {
      position: absolute;
      inset: 0;
      background: rgba(37, 99, 235, 0.08);
      backdrop-filter: blur(2px);
      border: 2px dashed var(--accent-primary);
      z-index: 50;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--accent-primary);
      font-weight: 600;
      font-size: 16px;
      pointer-events: none;
    }

    .drop-overlay.active {
      display: flex;
    }

    /* Splitter / Resizer */
    .splitter {
      width: 6px;
      background: var(--border-color);
      cursor: col-resize;
      transition: background 0.15s ease;
      z-index: 10;
      flex-shrink: 0;
      position: relative;
    }

    .splitter:hover, .splitter.dragging {
      background: var(--accent-primary);
    }

    /* Right: Preview Pane */
    .pane-preview {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 280px;
      background: var(--bg-preview-canvas);
      overflow: hidden;
    }

    .preview-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      justify-content: center;
    }

    /* Document Sheet Appearance in Screen UI */
    .preview-paper {
      width: 100%;
      max-width: 820px;
      min-height: 100%;
      background: var(--bg-preview-paper);
      padding: 56px 64px;
      border-radius: 8px;
      box-shadow: var(--shadow-paper);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      box-sizing: border-box;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* ==========================================================================
       Rendered Document Typography & Styling
       ========================================================================== */
    .rendered-content {
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.68;
      color: var(--text-main);
      word-wrap: break-word;
    }

    .rendered-content > *:first-child {
      margin-top: 0 !important;
    }

    .rendered-content > *:last-child {
      margin-bottom: 0 !important;
    }

    /* Headings */
    .rendered-content h1,
    .rendered-content h2,
    .rendered-content h3,
    .rendered-content h4,
    .rendered-content h5,
    .rendered-content h6 {
      color: var(--text-main);
      font-weight: 700;
      line-height: 1.3;
      margin-top: 1.6em;
      margin-bottom: 0.6em;
    }

    .rendered-content h1 {
      font-size: 2.1em;
      padding-bottom: 0.35em;
      border-bottom: 1px solid var(--border-color);
    }

    .rendered-content h2 {
      font-size: 1.55em;
      padding-bottom: 0.25em;
      border-bottom: 1px solid var(--border-subtle);
    }

    .rendered-content h3 { font-size: 1.28em; }
    .rendered-content h4 { font-size: 1.1em; }
    .rendered-content h5 { font-size: 0.95em; }
    .rendered-content h6 { font-size: 0.85em; text-transform: uppercase; color: var(--text-muted); }

    /* Paragraphs & Text */
    .rendered-content p {
      margin-top: 0;
      margin-bottom: 1.15em;
    }

    .rendered-content a {
      color: var(--accent-primary);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .rendered-content strong {
      font-weight: 600;
    }

    .rendered-content del {
      color: var(--text-muted);
    }

    .rendered-content hr {
      height: 1px;
      background-color: var(--border-color);
      border: none;
      margin: 2em 0;
    }

    /* Lists */
    .rendered-content ul,
    .rendered-content ol {
      margin-top: 0;
      margin-bottom: 1.15em;
      padding-left: 1.8em;
    }

    .rendered-content li {
      margin-bottom: 0.35em;
    }

    .rendered-content li > ul,
    .rendered-content li > ol {
      margin-top: 0.25em;
      margin-bottom: 0.25em;
    }

    /* Task Lists (GFM) - Clean styling without bullet artifacts */
    .rendered-content ul:has(input[type="checkbox"]),
    .rendered-content ol:has(input[type="checkbox"]) {
      list-style-type: none;
      padding-left: 0.2em;
    }

    .rendered-content li:has(input[type="checkbox"]) {
      list-style-type: none;
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 0.4em;
    }

    .rendered-content input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--text-muted);
      border-radius: 4px;
      outline: none;
      margin: 0;
      vertical-align: middle;
      position: relative;
      cursor: default;
      background: transparent;
      transform: translateY(2px);
      flex-shrink: 0;
    }

    .rendered-content input[type="checkbox"]:checked {
      background-color: var(--accent-primary);
      border-color: var(--accent-primary);
    }

    .rendered-content input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4.5px;
      top: 1.5px;
      width: 4px;
      height: 8px;
      border: solid #ffffff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* Blockquotes */
    .rendered-content blockquote {
      margin: 1.25em 0;
      padding: 0.7em 1.2em;
      border-left: 4px solid var(--accent-primary);
      background: var(--bg-blockquote);
      border-radius: 0 6px 6px 0;
      color: var(--text-main);
    }

    .rendered-content blockquote p:last-child {
      margin-bottom: 0;
    }

    /* Tables (GFM) */
    .rendered-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.4em 0;
      font-size: 14px;
      overflow-x: auto;
      display: table;
    }

    .rendered-content th,
    .rendered-content td {
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      text-align: left;
    }

    .rendered-content th {
      background-color: var(--bg-table-header);
      font-weight: 600;
      color: var(--text-main);
    }

    .rendered-content tr:nth-child(even) td {
      background-color: var(--bg-table-alt);
    }

    /* Inline Code */
    .rendered-content code:not([class*="language-"]):not(.hljs) {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--bg-inline-code);
      color: var(--text-code);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    /* Code Blocks */
    .code-block-wrapper {
      margin: 1.3em 0;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-code-block);
      overflow: hidden;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      background: var(--bg-code-header);
      border-bottom: 1px solid var(--border-color);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .copy-snippet-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-family: var(--font-sans);
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .copy-snippet-btn:hover {
      background: var(--border-color);
      color: var(--text-main);
    }

    .rendered-content pre {
      margin: 0;
      padding: 14px 16px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.55;
      background: transparent;
    }

    .rendered-content pre code {
      font-family: inherit;
      font-size: inherit;
      padding: 0;
      background: transparent;
      border: none;
      display: block;
    }

    /* Images & Captions */
    .rendered-content img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 1.2em auto;
      display: block;
    }

    .rendered-content img + em {
      display: block;
      text-align: center;
      font-size: 0.9em;
      color: var(--text-muted);
      margin-top: -0.6em;
      margin-bottom: 1.4em;
    }

    /* Mermaid Diagrams */
    .mermaid-wrapper {
      margin: 1.6em 0;
      padding: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
    }

    .mermaid {
      font-family: var(--font-sans) !important;
      text-align: center;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .mermaid svg {
      max-width: 100% !important;
      height: auto !important;
    }

    /* KaTeX Math */
    .katex-display {
      margin: 1.2em 0 !important;
      padding: 10px 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    [data-theme="dark"] .toast {
      background: #3b82f6;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

      /**
       * Fast 32-bit FNV-1a hash — avoids expensive string comparison on long docs.
       * Returns a numeric hash suitable for equality checks.
       */
      function fnv1aHash(str) {
        let hash = 0x811c9dc5; // FNV offset basis
        for (let i = 0, len = str.length; i < len; i++) {
          hash ^= str.charCodeAt(i);
          hash = (hash * 0x01000193) >>> 0; // FNV prime, keep as uint32
        }
        return hash;
      }

        return matches ? matches.length : 0;

      /**
       * Compute adaptive debounce delay based on document complexity.
       * Small simple docs get near-instant feedback; large docs with
       * mermaid/math get more breathing room to avoid jank.
       */
      function getDebounceDelay(text) {
        const len = text.length;
        const hasMermaid = text.includes('```mermaid');
        const hasMath = text.includes('$$');

        // Base: 80ms for tiny docs, scales up for larger ones
        let delay = 80;
        if (len > 5000) delay = 120;
        if (len > 15000) delay = 180;
        if (len > 40000) delay = 250;

        // Penalty for expensive renderers
        if (hasMermaid) delay += 60;
        if (hasMath) delay += 30;

        return Math.min(delay, 350);

        try {
          const html = marked.parse(raw);
          previewContent.innerHTML = html;
        } catch (err) {
          console.error('Marked parsing error:', err);
          previewContent.innerHTML = `<p style="color:red;">Error parsing markdown: ${escapeHtml(err.message)}</p>`;
        }

        // Render only changed Mermaid diagrams
        scheduleMermaid();

        // Update stats via rAF to avoid layout thrashing
        scheduleStatsUpdate(raw);

        // Schedule debounced localStorage save (separate from render)
        scheduleSave(raw);
      }

      // -------------------------------------------------------------------------
      // Mermaid: Diff-based rendering (only re-render changed diagrams)
      // -------------------------------------------------------------------------
      function scheduleMermaid() {
        if (typeof mermaid === 'undefined') return;
        clearTimeout(mermaidTimeout);
        mermaidTimeout = setTimeout(renderMermaidDiff, 300);
      }

      async function renderMermaidDiff() {
        const mermaidNodes = previewContent.querySelectorAll('pre.mermaid');
        if (mermaidNodes.length === 0) {
          lastMermaidSources.clear();
          return;
        }

        const currentSources = new Map();
        const nodesToRender = [];

        mermaidNodes.forEach((node, index) => {
          const source = node.textContent.trim();
          // Assign a stable ID based on position for cache lookup
          const posKey = `mermaid-pos-${index}`;
          currentSources.set(posKey, source);

          // Only re-render if source text changed or is new
          if (lastMermaidSources.get(posKey) !== source) {
            // Mermaid needs a unique ID attribute to render into
            mermaidIdCounter++;
            node.id = `mermaid-render-${mermaidIdCounter}`;
            nodesToRender.push(node);
          }
        });

        lastMermaidSources = currentSources;

        if (nodesToRender.length === 0) return;

        try {
          await mermaid.run({ nodes: nodesToRender });
        } catch (err) {
          console.warn('Mermaid rendering notice:', err);
        }
      }

      // -------------------------------------------------------------------------
      // Stats: Batched via requestAnimationFrame
      // -------------------------------------------------------------------------
      function scheduleStatsUpdate(text) {
        if (statsRafId) cancelAnimationFrame(statsRafId);
        statsRafId = requestAnimationFrame(() => {
          const words = countWords(text);
          const chars = text.length;
          const readTime = Math.max(1, Math.ceil(words / 200));

          // Only touch DOM if values actually changed
          const wordsStr = `${words.toLocaleString()} words`;
          const charsStr = `${chars.toLocaleString()} characters`;
          const readStr = `${readTime} min read`;

          if (statWords.textContent !== wordsStr) statWords.textContent = wordsStr;
          if (statChars.textContent !== charsStr) statChars.textContent = charsStr;
          if (statReadTime.textContent !== readStr) statReadTime.textContent = readStr;

          statsRafId = null;
        });
      }

      // -------------------------------------------------------------------------
      // LocalStorage Persistence (Debounced — 1.5s after last edit)
      // -------------------------------------------------------------------------
      const STORAGE_KEY_CONTENT = 'markprint_draft_content';
      const STORAGE_KEY_FILENAME = 'markprint_filename';
      const STORAGE_KEY_THEME = 'markprint_theme';
      const STORAGE_KEY_SPLIT = 'markprint_split_pos';

      function scheduleSave(content) {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
          try {
            localStorage.setItem(STORAGE_KEY_CONTENT, content);
            saveIndicator.style.background = '#10b981';
            saveIndicator.title = 'Draft saved in local browser storage';
          } catch (e) {
            console.warn('LocalStorage save failed:', e);
          }
        }, 1500);
      }

      // Immediate save (used on file load, sample load, etc.)
      function saveToLocalStorageImmediate(content) {
        clearTimeout(saveTimeout);
        try {
          localStorage.setItem(STORAGE_KEY_CONTENT, content);
          saveIndicator.style.background = '#10b981';
          saveIndicator.title = 'Draft saved in local browser storage';
        } catch (e) {
          console.warn('LocalStorage save failed:', e);
        }
      }

      function setFilename(name) {
        currentFilenameEl.textContent = name;
        try {
          localStorage.setItem(STORAGE_KEY_FILENAME, name);
        } catch (e) {}
      }

      // Save before page unload to catch any pending debounced saves
      window.addEventListener('beforeunload', () => {
        clearTimeout(saveTimeout);
        try {
          localStorage.setItem(STORAGE_KEY_CONTENT, editor.value);
        } catch (e) {}
      });

      // -------------------------------------------------------------------------
      // Toast Notification
      // -------------------------------------------------------------------------
      let toastTimer = null;
      function showToast(message) {
        toastMsgEl.textContent = message;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 2200);
      }

      // -------------------------------------------------------------------------
      // Theme Toggle (Dark / Light)
      // -------------------------------------------------------------------------
      function setTheme(theme) {
        const isDark = theme === 'dark';
        document.documentElement.setAttribute('data-theme', theme);

        if (isDark) {
          themeIconSun.style.display = 'block';
          themeIconMoon.style.display = 'none';
          hljsLight.disabled = true;
          hljsDark.disabled = false;
        } else {
          themeIconSun.style.display = 'none';
          themeIconMoon.style.display = 'block';
          hljsLight.disabled = false;
          hljsDark.disabled = true;
        }

        try {
          localStorage.setItem(STORAGE_KEY_THEME, theme);
        } catch (e) {}

        // Re-initialize mermaid with matching theme and force re-render
        initMermaid();
        lastMermaidSources.clear(); // Force mermaid re-render with new theme
        forceNextRender = true;
        renderMarkdown();
      }

      btnToggleTheme.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
        setTheme(nextTheme);
        showToast(nextTheme === 'dark' ? 'Dark mode enabled (Print will match)' : 'Light mode enabled');
      });

      // -------------------------------------------------------------------------
      // File Loading (FileReader & Drag-and-Drop)
      // -------------------------------------------------------------------------
      function loadFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const content = e.target.result;
          editor.value = content;
          setFilename(file.name);
          lastRenderedHash = null; // Force re-render for new file
          lastMermaidSources.clear();
          renderMarkdown();
          saveToLocalStorageImmediate(content);
          showToast(`Loaded ${file.name}`);
        };
        reader.onerror = () => {
          showToast('Failed to read file');
        };
        reader.readAsText(file);
      }

      btnOpenFile.addEventListener('click', () => {
        fileInput.value = '';
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          loadFile(e.target.files[0]);
        }
      });

      // Drag and Drop Handling
      let dragCounter = 0; // Track nested drag events for reliable overlay

      window.addEventListener('dragenter', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter++;
        dropOverlay.classList.add('active');
      }, false);

      window.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
      }, false);

      window.addEventListener('dragleave', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter--;
        if (dragCounter <= 0) {
          dragCounter = 0;
          dropOverlay.classList.remove('active');
        }
      }, false);

      window.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dragCounter = 0;
        dropOverlay.classList.remove('active');
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
          loadFile(e.dataTransfer.files[0]);
        }
      }, false);

      // -------------------------------------------------------------------------
      // PDF Export
      // -------------------------------------------------------------------------
      btnExportPdf.addEventListener('click', () => {
        window.print();
      });

      // -------------------------------------------------------------------------
      // Copy HTML Button
      // -------------------------------------------------------------------------
      btnCopyHtml.addEventListener('click', async () => {
        const html = previewContent.innerHTML;
        try {
          await navigator.clipboard.writeText(html);
          showToast('Rendered HTML copied to clipboard!');
        } catch (err) {
          const ta = document.createElement('textarea');
          ta.value = html;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('Rendered HTML copied to clipboard!');
        }
      });

      // -------------------------------------------------------------------------
      // Sample Document Loader
      // -------------------------------------------------------------------------
      btnLoadSample.addEventListener('click', () => {
        if (editor.value.trim() && editor.value !== SAMPLE_MARKDOWN) {
          const confirmLoad = confirm('Replace current draft with the sample document showcase?');
          if (!confirmLoad) return;
        }
        editor.value = SAMPLE_MARKDOWN;
        setFilename('sample-specification.md');
        lastRenderedHash = null;
        lastMermaidSources.clear();
        renderMarkdown();
        saveToLocalStorageImmediate(SAMPLE_MARKDOWN);
        showToast('Sample document loaded');
      });

      // -------------------------------------------------------------------------
      // Textarea Tab Key Handling & Live Input
      // -------------------------------------------------------------------------
      editor.addEventListener('keydown', (e) => {
        // Tab Key for 2-space indentation
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = editor.selectionStart;
          const end = editor.selectionEnd;

          if (start === end) {
            // No selection: insert 2 spaces
            document.execCommand('insertText', false, '  ');
          } else {
            // Multi-line selection: indent or dedent
            const val = editor.value;
            const lineStart = val.lastIndexOf('\n', start - 1) + 1;
            const lineEnd = val.indexOf('\n', end);
            const actualEnd = lineEnd === -1 ? val.length : lineEnd;
            const lines = val.substring(lineStart, actualEnd).split('\n');

            let modified = '';
            if (e.shiftKey) {
              // Dedent
              modified = lines.map(line => line.startsWith('  ') ? line.substring(2) : (line.startsWith(' ') ? line.substring(1) : line)).join('\n');
            } else {
              // Indent
              modified = lines.map(line => '  ' + line).join('\n');
            }

            editor.setSelectionRange(lineStart, actualEnd);
            document.execCommand('insertText', false, modified);
          }
        }
      });

      // Adaptive debounce on input
      editor.addEventListener('input', () => {
        saveIndicator.style.background = '#f59e0b';
        saveIndicator.title = 'Unsaved changes in progress...';
        clearTimeout(renderTimeout);
        const delay = getDebounceDelay(editor.value);
        renderTimeout = setTimeout(renderMarkdown, delay);
      });

      // -------------------------------------------------------------------------
      // Formatting Bar Helpers
      // -------------------------------------------------------------------------
      document.querySelectorAll('.formatting-bar .tool-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.getAttribute('data-format');
          applyFormatting(action);
        });
      });

      function applyFormatting(action) {
        editor.focus();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const selected = editor.value.substring(start, end);

        let before = '';
        let after = '';
        let placeholder = '';

        switch (action) {
          case 'bold':
            before = '**'; after = '**'; placeholder = 'bold text';
            break;
          case 'italic':
            before = '*'; after = '*'; placeholder = 'italic text';
            break;
          case 'h1':
            before = '# '; placeholder = 'Heading 1';
            break;
          case 'h2':
            before = '## '; placeholder = 'Heading 2';
            break;
          case 'code':
            before = '`'; after = '`'; placeholder = 'code';
            break;
          case 'codeblock':
            before = '```javascript\n'; after = '\n```'; placeholder = '// code block';
            break;
          case 'quote':
            before = '> '; placeholder = 'Quote text';
            break;
          case 'table':
            before = '| Header 1 | Header 2 |\n| :--- | :--- |\n| Value 1 | Value 2 |\n';
            break;
          case 'math':
            before = '$$\n'; after = '\n$$'; placeholder = 'E = mc^2';
            break;
          case 'mermaid':
            before = '```mermaid\ngraph TD\n    A[Start] --> B[Process]\n    B --> C[Finish]\n```\n';
            break;
        }

        const insert = before + (selected || placeholder) + after;
        document.execCommand('insertText', false, insert);
        renderMarkdown();
      }

      // -------------------------------------------------------------------------
      // Draggable Splitter (Optimized: cached rect, rAF, debounced storage)
      // -------------------------------------------------------------------------
      let isDraggingSplitter = false;
      let cachedWorkspaceRect = null;
      let splitterSaveTimeout = null;
      let splitterRafId = null;

      splitter.addEventListener('mousedown', () => {
        isDraggingSplitter = true;
        // Cache rect once on mousedown instead of every mousemove
        cachedWorkspaceRect = document.getElementById('workspace').getBoundingClientRect();
        splitter.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDraggingSplitter || !cachedWorkspaceRect) return;

        // Batch DOM write with rAF to avoid layout thrashing
        if (splitterRafId) cancelAnimationFrame(splitterRafId);
        const clientX = e.clientX;
        splitterRafId = requestAnimationFrame(() => {
          const offset = clientX - cachedWorkspaceRect.left;
          const totalWidth = cachedWorkspaceRect.width;
          let percentage = (offset / totalWidth) * 100;

          // Constrain width
          if (percentage < 20) percentage = 20;
          if (percentage > 80) percentage = 80;

          paneEditor.style.width = `${percentage}%`;

          // Debounced localStorage write (300ms after last move, not every pixel)
          clearTimeout(splitterSaveTimeout);
          splitterSaveTimeout = setTimeout(() => {
            try {
              localStorage.setItem(STORAGE_KEY_SPLIT, percentage);
            } catch (e) {}
          }, 300);

          splitterRafId = null;
        });
      });

      window.addEventListener('mouseup', () => {
        if (isDraggingSplitter) {
          isDraggingSplitter = false;
          cachedWorkspaceRect = null;
          splitter.classList.remove('dragging');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';

          // Final save of position on mouse up
          const currentWidth = parseFloat(paneEditor.style.width);
          if (!isNaN(currentWidth)) {
            try {
              localStorage.setItem(STORAGE_KEY_SPLIT, currentWidth);
            } catch (e) {}
          }
        }
      });

      // Double-click splitter to reset 50/50
      splitter.addEventListener('dblclick', () => {
        paneEditor.style.width = '50%';
        try {
          localStorage.setItem(STORAGE_KEY_SPLIT, 50);
        } catch (e) {}
      });

      // -------------------------------------------------------------------------
      // Initial Setup on Page Load
      // -------------------------------------------------------------------------
      function initialize() {
        // Restore theme
        const savedTheme = localStorage.getItem(STORAGE_KEY_THEME) || 'light';
        setTheme(savedTheme);

        // Restore split position
        const savedSplit = localStorage.getItem(STORAGE_KEY_SPLIT);
        if (savedSplit && window.innerWidth > 768) {
          paneEditor.style.width = `${savedSplit}%`;
        }

        // Restore filename
        const savedFilename = localStorage.getItem(STORAGE_KEY_FILENAME);
        if (savedFilename) {
          setFilename(savedFilename);
        }

        // Restore draft content or load default sample
        const savedContent = localStorage.getItem(STORAGE_KEY_CONTENT);
        if (savedContent && savedContent.trim().length > 0) {
          editor.value = savedContent;
        } else {
          editor.value = SAMPLE_MARKDOWN;
          setFilename('sample-specification.md');
        }

        renderMarkdown();
      }

      initialize();
    })();
  </script>
</body>
</html>
